<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="master.css">
    <title>picture</title>
</head>
<body>
    <div class="header">sponsorship</div>

    <div class="form-container">
      <form>
        <h3>Non-Profit Organization</h3>
        <div class="form-group">
          <label>Name</label>
          <input type="text" name="org_name">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" name="org_phone">
        </div>
        <div class="form-group">
          <label>Street Address</label>
          <input type="text" name="org_address">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" name="org_city">
          </div>
          <div class="form-group">
            <label>State</label>
            <input type="text" name="org_state">
          </div>
          <div class="form-group">
            <label>Zip Code</label>
            <input type="text" name="org_zip">
          </div>
        </div>
  
        <h3>Sponsor Contact Information</h3>
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" name="first_name">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" name="last_name">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="sponsor_phone">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="sponsor_email">
          </div>
        </div>
        <div class="form-group">
          <label>Street Address</label>
          <input type="text" name="sponsor_address">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" name="sponsor_city">
          </div>
          <div class="form-group">
            <label>State</label>
            <input type="text" name="sponsor_state">
          </div>
          <div class="form-group">
            <label>Zip Code</label>
            <input type="text" name="sponsor_zip">
          </div>
        </div>
  
        <h3>Donation</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Donation Amount</label>
            <select name="donation_amount">
              <option>$50</option>
              <option>$100</option>
              <option>$250</option>
              <option>$500</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Payment Method</label>
            <select name="payment_method">
              <option>Credit Card</option>
              <option>PayPal</option>
              <option>Bank Transfer</option>
            </select>
          </div>
        </div>
  
        <div style="text-align: right; margin-top: 20px;">
          <button class="submit-btn" type="submit">Submit</button>
        </div>
      </form>
    </div>
</body>
</html>
